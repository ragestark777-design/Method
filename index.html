<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Optimizer</title>
    
    <!-- Сервис-воркер для поддержки Cross-Origin заголовков FFmpeg -->
    <script src="coi-serviceworker.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Библиотека FFmpeg.wasm -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
    <div class="card">
        <h2>TikTok Video Optimizer</h2>
        <p>Преобразование 4K 120 FPS в 1080p 60 FPS (Motion Blur + Sharp)</p>
        
        <input type="file" id="video-input" accept="video/*">
        <button id="process-btn">Оптимизировать видео</button>
        
        <div id="status">Ожидание файла...</div>
        <a id="download-link" style="display:none;" download="tiktok_ready.mp4">Скачать готовый файл</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
