<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Optimizer</title>

    <!-- Встроенная мобильная консоль Eruda -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <link rel="stylesheet" href="style.css">
    
    <!-- Стабильный JS обёртчик FFmpeg -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
</head>
<body>
    <div class="card">
        <h2>TikTok Video Optimizer</h2>
        <p>Преобразование 4K 120 FPS в 1080p 60 FPS (Motion Blur + Sharp)</p>
        
        <input type="file" id="video-input" accept="video/*">
        <button id="process-btn">Оптимизировать видео</button>
        
        <div id="status">Ожидание файла...</div>
        <a id="download-link" style="display:none;" target="_blank">Загрузка...</a>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
